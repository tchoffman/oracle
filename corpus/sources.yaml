# Starter corpus catalog. scripts/fetch-corpus.sh reads this to download everything.
# Keep sizes modest for the dev machine (16GB RAM / 80GB free) — the "cage machine"
# can scale this up (uncomment the heavy items or add more).
#
# ZIM entries may use either:
#   url:            direct URL, OR
#   kiwix_project:  project dir under https://download.kiwix.org/zim/<project>/
#   kiwix_prefix:   filename prefix to match (latest dated file wins)
#
# Example resolving to the latest Wikipedia Simple English, nopic:
#   kiwix_project: wikipedia
#   kiwix_prefix: wikipedia_en-simple_all_nopic_
#
# Run `scripts/fetch-corpus.sh` to materialize these into build/corpus/{zims,pdfs}/.

zims:
  - name: wikipedia-simple-nopic
    kiwix_project: wikipedia
    kiwix_prefix: wikipedia_en-simple_all_nopic_
    license: CC-BY-SA 4.0
    size: ~400MB
    notes: Simple English Wikipedia (no images). Broad coverage, small footprint.

  - name: wikivoyage-nopic
    kiwix_project: wikivoyage
    kiwix_prefix: wikivoyage_en_all_nopic_
    license: CC-BY-SA 3.0
    size: ~500MB
    notes: Travel guide — practical geography, routes, local info.

  - name: ifixit-en
    kiwix_project: ifixit
    kiwix_prefix: ifixit_en_all_
    license: CC-BY-NC-SA
    size: ~3GB
    notes: Repair manuals for thousands of devices.

  - name: wiktionary-simple-nopic
    kiwix_project: wiktionary
    kiwix_prefix: wiktionary_en-simple_all_nopic_
    license: CC-BY-SA 4.0
    size: ~100MB
    notes: Simple English dictionary — words, meanings.
    optional: true

  # Uncomment on a beefier machine — full English Wikipedia (no images).
  # - name: wikipedia-en-nopic
  #   kiwix_project: wikipedia
  #   kiwix_prefix: wikipedia_en_all_nopic_
  #   license: CC-BY-SA 4.0
  #   size: ~57GB

pdfs:
  - name: fm-21-76-survival
    url: https://archive.org/download/MilitaryManual-Fm21-76USArmySurvivalManual/fm21-76%20%28US%20Army%20Survival%20Manual%29.pdf
    license: Public domain (US Army)
    size: ~6MB
    notes: Classic US Army survival field manual.

  - name: fm-3-05-70-survival-evasion-recovery
    url: https://archive.org/download/milmanual-fm-3-05.70-survival/fm-3-05.70-survival.pdf
    license: Public domain (US Army)
    size: ~4MB
    notes: Army SERE (Survival, Evasion, Resistance, Escape) manual.

  - name: where-there-is-no-doctor
    url: https://store.hesperian.org/prod/Where_There_Is_No_Doctor.html
    license: Hesperian — free for non-commercial
    size: ~30MB
    notes: Field medical reference. The canonical off-grid medicine book.
    manual: true  # Hesperian requires registration — download by hand, drop into build/corpus/pdfs/

  - name: where-there-is-no-dentist
    url: https://store.hesperian.org/prod/Where_There_Is_No_Dentist.html
    license: Hesperian — free for non-commercial
    size: ~15MB
    notes: Same as above — manual download required.
    manual: true
